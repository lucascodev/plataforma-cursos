name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only pull requests are cancelled: a run on main may be in the middle of a migration.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Seed do banco local está atualizado
        run: |
          pnpm db:seed
          git diff --exit-code supabase/seed.sql
      - name: Build (o postbuild procura chaves no resultado)
        run: pnpm build
      - name: Auditoria das dependências de produção
        run: pnpm audit:prod

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sobe só o banco, a API e o Auth do Supabase
        run: pnpm exec supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,mailpit,postgres-meta,supavisor
      - name: Aplica todas as migrations do zero e o seed
        run: pnpm db:reset
      - name: Testes de RLS e das funções (pgTAP)
        run: pnpm db:test
      - name: Lint do schema
        run: pnpm db:lint

  # Migrations first, then the Cloudflare build: the database is always at least as new as the code that reads it.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, db]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations pendentes (direto no projeto)
        if: env.SUPABASE_DB_URL == ''
        run: |
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_ID"
          pnpm exec supabase db push --linked --dry-run
          pnpm exec supabase db push --linked
      # The direct database host is IPv6 only; set SUPABASE_DB_URL to the session pooler if the runner cannot reach it.
      - name: Migrations pendentes (pelo pooler)
        if: env.SUPABASE_DB_URL != ''
        run: |
          pnpm exec supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
          pnpm exec supabase db push --db-url "$SUPABASE_DB_URL"
      - name: Deploy no Cloudflare Pages
        run: |
          head=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::A main já está em $head. A execução desse commit aplica as migrations dele e faz o deploy."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$CLOUDFLARE_DEPLOY_HOOK" > /dev/null
          echo "Deploy de $GITHUB_SHA pedido ao Cloudflare."

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
